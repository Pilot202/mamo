# cloudbuild.yaml – builds and pushes both frontend & backend images
steps:
# ---- Frontend ---------------------------------------------------------------
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '-t'
    - 'us-central1-docker.pkg.dev/agentic-465416-486213/mamo-repo/mamo-frontend:latest'
    - '-f'
    - 'frontend/Dockerfile'
    - 'frontend'

# ---- Backend ---------------------------------------------------------------
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '-t'
    - 'us-central1-docker.pkg.dev/agentic-465416-486213/mamo-repo/mamo-backend:latest'
    - '-f'
    - 'backend/Dockerfile'
    - 'backend'

# ---- Push images ------------------------------------------------------------
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$agentic-465416-486213/mamo-repo/mamo-frontend:latest']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$agentic-465416-486213/mamo-repo/mamo-backend:latest']

images:
- 'us-central1-docker.pkg.dev/$agentic-465416-486213/mamo-repo/mamo-frontend:latest'
- 'us-central1-docker.pkg.dev/$agentic-465416-486213/mamo-repo/mamo-backend:latest'
